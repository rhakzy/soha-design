<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ============================================================
         🔧 [수정 포인트 1] 웹사이트 탭 제목
         브라우저 탭에 표시되는 이름입니다.
         ============================================================ -->
    <title>SOHA DESIGN</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================================
           🎨 [수정 포인트 2] 브랜드 컬러
           전체 웹사이트의 색상을 여기서 변경할 수 있습니다.
           
           --deep-navy: 메인 어두운 색 (텍스트, 푸터 배경)
           --warm-gold: 포인트 색 (호버, 강조)
           --soft-sage: 부제목, 보조 색상
           --white: 배경 색 (미색)
           --pure-white: 순수 흰색
           ============================================================ */
        :root {
            /* 기존 SOHA DESIGN 브랜드 컬러 */
            --deep-navy: #1A2332;
            --warm-gold: #C9A961;
            --soft-sage: #8FA998;
            --white: #FAFAFA;
            --pure-white: #FFFFFF;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--white);
            color: var(--deep-navy);
            overflow-x: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: default;
        }

        /* 이미지 저장 방지 */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        /* 클릭 가능한 요소는 포인터 유지 */
        a, button, .project-item, .back-btn, .filter-btn, .logo, .logo-text, .nav-links a, .dropdown-item, .detail-image {
            cursor: pointer;
            pointer-events: auto;
        }

        .detail-image img {
            pointer-events: none;
        }

        /* 세리프 폰트 클래스 */
        .serif {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        nav.scrolled {
            background: rgba(250, 250, 250, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 1px 0 rgba(26, 35, 50, 0.05);
        }

        /* ============================================================
           🔧 [수정 포인트] 상단 로고 크기 (PC)
           height 값을 변경하세요. 예: 25px, 30px, 35px
           ============================================================ */
        .logo {
            height: 30px;
            max-height: 30px;
            width: auto;
            cursor: pointer;
            transition: all 0.4s ease;
            user-select: none;
        }

        .logo:hover {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            color: var(--deep-navy);
            cursor: pointer;
            user-select: none;
            transition: all 0.4s ease;
        }

        .logo-text:hover {
            color: var(--warm-gold);
        }

        .nav-links {
            display: flex;
            gap: 3.5rem;
            list-style: none;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links a {
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--deep-navy);
            cursor: pointer;
            position: relative;
            transition: color 0.4s ease;
            padding-bottom: 4px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--warm-gold);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-links a:hover {
            color: var(--warm-gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: -1.5rem;
            padding-top: 1.5rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-links li:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-content {
            background: var(--pure-white);
            padding: 1.8rem 2rem;
            min-width: 220px;
            box-shadow: 0 20px 60px rgba(26, 35, 50, 0.12);
            border-left: 2px solid var(--warm-gold);
        }

        .dropdown-item {
            display: block;
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--deep-navy);
            padding: 0.9rem 0;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(26, 35, 50, 0.06);
            position: relative;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item::before {
            content: '';
            position: absolute;
            left: -2rem;
            top: 50%;
            width: 0;
            height: 1px;
            background: var(--warm-gold);
            transition: width 0.3s ease;
        }

        .dropdown-item:hover {
            color: var(--warm-gold);
            padding-left: 1rem;
        }

        .dropdown-item:hover::before {
            width: 1rem;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 3rem;
            background: var(--white);
        }

        .hero-content {
            text-align: center;
            max-width: 1000px;
            position: relative;
            z-index: 1;
        }

        /* 메인(히어로) 로고 이미지 크기 */
        .hero-logo {
            max-width: 700px;
            width: 60%;
            height: auto;
            margin: 0 auto 2rem;
            display: block;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(4.5rem, 14vw, 12rem);
            font-weight: 300;
            letter-spacing: 0.02em;
            line-height: 0.9;
            margin-bottom: 2rem;
            color: var(--deep-navy);
            animation: fadeUp 1s ease forwards;
        }

        .hero h1 span {
            display: block;
            font-weight: 500;
        }

        .hero-subtitle {
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--warm-gold);
            margin-bottom: 4rem;
            animation: fadeUp 1s ease 0.2s forwards;
            opacity: 0;
        }

        .hero-description {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 300;
            line-height: 1.8;
            max-width: 550px;
            margin: 0 auto;
            color: var(--deep-navy);
            opacity: 0;
            animation: fadeUp 1s ease 0.4s forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 0.9;
                transform: translateY(0);
            }
        }

        /* Scroll indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            animation: fadeUp 1s ease 0.8s forwards;
            opacity: 0;
        }

        .scroll-indicator span {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--soft-sage);
        }

        .scroll-line {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, var(--warm-gold), transparent);
            animation: scrollPulse 2s ease infinite;
        }

        @keyframes scrollPulse {
            0%, 100% { opacity: 0.3; transform: scaleY(1); }
            50% { opacity: 1; transform: scaleY(1.2); }
        }

        /* Main Content Area */
        .content-wrapper {
            padding: 0 3rem 8rem;
            max-width: 1800px;
            margin: 0 auto;
            background: transparent;
        }

        /* Projects Masonry Layout */
        .projects-section {
            margin-top: 8rem;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.5rem, 10vw, 8rem);
            font-weight: 300;
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
            color: var(--deep-navy);
            position: relative;
            display: inline-block;
        }

        .section-subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--soft-sage);
            margin-bottom: 4rem;
            display: block;
        }

        .filter-container {
            display: flex;
            gap: 3rem;
            margin-bottom: 5rem;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(26, 35, 50, 0.08);
            padding-bottom: 2rem;
        }

        .filter-btn {
            background: none;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--deep-navy);
            cursor: pointer;
            padding: 0.5rem 0;
            position: relative;
            opacity: 0.35;
            transition: all 0.4s ease;
        }

        .filter-btn.active {
            opacity: 1;
            color: var(--warm-gold);
        }

        .filter-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--warm-gold);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .filter-btn:hover {
            opacity: 0.8;
        }

        .filter-btn.active::after {
            width: 100%;
        }

        /* Masonry Grid */
        .masonry-grid {
            column-count: 3;
            column-gap: 2.5rem;
            margin-bottom: 8rem;
            max-width: 1800px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 2rem;
        }

        @media (max-width: 1400px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (max-width: 768px) {
            .masonry-grid {
                column-count: unset;
                display: flex;
                flex-direction: column;
            }
        }

        .project-item {
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 2.5rem;
            break-inside: avoid;
            display: block;
        }

        .project-item.wide {
            aspect-ratio: 4/3;
        }

        .project-item.tall {
            aspect-ratio: 3/4;
        }

        .project-item.square {
            aspect-ratio: 1/1;
        }

        /* 모바일에서는 비율 통일 (한 줄 나열이라 다양성 의미 없음) */
        @media (max-width: 768px) {
            .project-item.wide,
            .project-item.tall,
            .project-item.square {
                aspect-ratio: 4/3;
            }
        }

        .project-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(26, 35, 50, 0.15);
        }

        .project-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            filter: grayscale(15%) contrast(1.05);
        }

        .project-item:hover img {
            transform: scale(1.08);
            filter: grayscale(0%) contrast(1);
        }

        .project-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, 
                rgba(26, 35, 50, 0.95) 0%, 
                rgba(26, 35, 50, 0.3) 40%,
                transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2.5rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .project-item:hover .project-overlay {
            opacity: 1;
        }

        .project-category {
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--warm-gold);
            margin-bottom: 0.8rem;
            font-weight: 400;
            transform: translateY(10px);
            transition: transform 0.5s ease 0.1s;
        }

        .project-item:hover .project-category {
            transform: translateY(0);
        }

        .project-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--pure-white);
            letter-spacing: 0.02em;
            transform: translateY(10px);
            transition: transform 0.5s ease;
        }

        .project-item:hover .project-name {
            transform: translateY(0);
        }

        /* Project Detail Page */
        .project-detail-page {
            padding: 11rem 3rem 8rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--deep-navy);
            margin-bottom: 5rem;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.4s ease;
        }

        .back-btn::before {
            content: '←';
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            opacity: 1;
            color: var(--warm-gold);
        }

        .back-btn:hover::before {
            transform: translateX(-5px);
        }

        .project-header {
            margin-bottom: 5rem;
            padding-bottom: 3rem;
            border-bottom: 1px solid rgba(26, 35, 50, 0.08);
        }

        .project-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 300;
            letter-spacing: 0.02em;
            margin-bottom: 1.5rem;
            line-height: 1;
        }

        .project-meta {
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--warm-gold);
            font-weight: 400;
        }

        .detail-images-grid {
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        .detail-image {
            width: 100%;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 0.8s ease forwards;
            overflow: hidden;
        }

        .detail-image:nth-child(1) { animation-delay: 0.1s; }
        .detail-image:nth-child(2) { animation-delay: 0.2s; }
        .detail-image:nth-child(3) { animation-delay: 0.3s; }
        .detail-image:nth-child(4) { animation-delay: 0.4s; }

        .detail-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.8s ease;
        }

        .detail-image:hover img {
            transform: scale(1.02);
        }

        .image-caption {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--soft-sage);
            margin-top: 1rem;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .image-caption::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--warm-gold);
            border-radius: 50%;
            flex-shrink: 0;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* About Page */
        .about-page {
            padding: 10rem 3rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .about-hero {
            margin-bottom: 8rem;
        }

        .about-hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 300;
            letter-spacing: 0.02em;
            line-height: 0.95;
            margin-bottom: 3rem;
        }

        .about-intro {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.3rem, 3vw, 2rem);
            font-weight: 300;
            line-height: 1.7;
            max-width: 800px;
            opacity: 0.85;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8rem;
            margin-bottom: 8rem;
        }

        .about-section h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            margin-bottom: 2.5rem;
            color: var(--deep-navy);
            position: relative;
            display: inline-block;
        }

        .about-section h2::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 0;
            width: 30px;
            height: 1px;
            background: var(--warm-gold);
        }

        .about-section p {
            font-size: 0.95rem;
            line-height: 2;
            font-weight: 300;
            opacity: 0.75;
            margin-bottom: 1.5rem;
        }

        .services-grid {
            display: grid;
            gap: 0;
            margin-top: 2rem;
        }

        .service-item {
            font-size: 0.85rem;
            font-weight: 300;
            padding: 1.8rem 0;
            border-bottom: 1px solid rgba(26, 35, 50, 0.08);
            letter-spacing: 0.05em;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            cursor: default;
        }

        .service-item:first-child {
            border-top: 1px solid rgba(26, 35, 50, 0.08);
        }

        .service-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0;
            height: 1px;
            background: var(--warm-gold);
            transition: width 0.4s ease;
        }

        .service-item:hover {
            color: var(--warm-gold);
            padding-left: 2rem;
        }

        .service-item:hover::before {
            width: 1rem;
        }

        .contact-section {
            background: var(--deep-navy);
            padding: 6rem;
            margin: 0 -3rem;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        .contact-section::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(201, 169, 97, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .contact-section h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 300;
            margin-bottom: 4rem;
            letter-spacing: 0.02em;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 4rem;
        }

        .contact-item {
            margin-bottom: 1.5rem;
        }

        .contact-label {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--warm-gold);
            margin-bottom: 1rem;
            font-weight: 400;
        }

        .contact-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        /* Footer */
        .footer {
            background: var(--deep-navy);
            padding: 6rem 3rem;
            color: var(--white);
            margin-top: 0;
            position: relative;
            overflow: hidden;
        }

        .footer::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(26, 35, 50, 0.5) 0%, transparent 100%);
            pointer-events: none;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .footer h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 300;
            margin-bottom: 4rem;
            letter-spacing: 0.02em;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 4rem;
        }

        .footer-item {
            margin-bottom: 1.5rem;
        }

        .footer-label {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--warm-gold);
            margin-bottom: 1rem;
            font-weight: 400;
        }

        .footer-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .footer-bottom {
            margin-top: 5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(250, 250, 250, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-copyright {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            opacity: 0.4;
        }

        /* Responsive */

        /* ---------- 공통 헬퍼 ---------- */
        const yearOf  = p => String(p.completedAt).slice(0, 4);
        const monthOf = p => String(p.completedAt).length >= 7 ? parseInt(String(p.completedAt).slice(5, 7), 10) : null;
        const fmtDate = v => { const s = String(v); return s.length >= 7 ? s.slice(2, 4) + '.' + s.slice(5, 7) : s; };

        /* 상세·라이트박스용으로 사진을 한 줄로 펼친다 (지점 경계 정보 유지) */
        const flatImages = p => p.stores
            ? p.stores.flatMap((st, si) => st.images.map(src => ({ src, store: st.name, si })))
            : (p.images || []).map(im => typeof im === 'string' ? { src: im } : { src: im.src, caption: im.caption });

        /* 정렬: 연도 내림차순 → 타입별로 월 내림차순(월 없음은 뒤) → id 오름차순 → 시공/3D 교차 */
        function sortProjects(list) {
            const rank = (a, b) => {
                const ma = monthOf(a), mb = monthOf(b);
                if (ma !== mb) { if (ma === null) return 1; if (mb === null) return -1; return mb - ma; }
                return a.id - b.id;
            };
            const years = [...new Set(list.map(yearOf))].sort().reverse();
            return years.flatMap(y => {
                const g = list.filter(p => yearOf(p) === y);
                const built = g.filter(p => p.type === 'built').sort(rank);
                const rend  = g.filter(p => p.type === '3d').sort(rank);
                const out = [];
                for (let i = 0; i < Math.max(built.length, rend.length); i++) {
                    if (i < built.length) out.push(built[i]);
                    if (i < rend.length)  out.push(rend[i]);
                }
                return out;
            });
        }

        const FILTERS = [

        /* ---------- 필터 바 ---------- */
        function FilterBar({ pool, filter, onChange }) {

                        return (

                                className={`filter-btn ${filter === f.key ? 'active' : ''}`}
                                onClick={() => onChange(f.key)}
                                disabled={count === 0}
                                aria-disabled={count === 0}
                                title={count === 0 ? '해당 프로젝트 없음' : undefined}

        /* ---------- 네비게이션 ---------- */
        function Navigation({ currentPage, navigate }) {
            const [scrolled, setScrolled] = useState(false);
            const [open, setOpen] = useState(false);
            const listRef = useRef(null);
            const btnRef = useRef(null);
            const wasOpen = useRef(false);

            useEffect(() => {
                const onScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', onScroll);
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            /* 열림 상태: 배경 스크롤 잠금 + ESC + 첫 항목 초점 */
            useEffect(() => {
                if (!open) {
                    document.body.style.overflow = '';
                    /* 처음 렌더에서는 초점을 옮기지 않는다 — 닫을 때만 버튼으로 되돌린다 */
                    if (wasOpen.current && btnRef.current) btnRef.current.focus();
                    wasOpen.current = false;
                    return;
                }
                wasOpen.current = true;
                document.body.style.overflow = 'hidden';
                /* inert 가 걸린 상태에서는 focus() 가 무시되므로 먼저 해제한다 */
                if (listRef.current) listRef.current.removeAttribute('inert');
                const first = listRef.current && listRef.current.querySelector('a');
                if (first) first.focus();

                const onKey = (e) => {
                    if (e.key === 'Escape') { setOpen(false); return; }
                    if (e.key !== 'Tab' || !listRef.current) return;
                    const f = [...listRef.current.querySelectorAll('a')];
                    if (!f.length) return;
                    const first = f[0], last = f[f.length - 1];
                    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [open]);

            /* 닫혀 있을 때 모바일에서 초점이 들어가지 않도록 */
            useEffect(() => {
                const el = listRef.current;
                if (!el) return;
                const mobile = window.matchMedia('(max-width: 768px)').matches;
                if (mobile && !open) el.setAttribute('inert', '');
                else el.removeAttribute('inert');
            }, [open]);

            const go = (page) => { setOpen(false); navigate(page, null, 'all'); };
            /* href 없는 <a> 는 탭 순서에 들어가지 않으므로 명시적으로 포커스 가능하게 만든다 */
            const linkProps = (page) => ({
                tabIndex: 0,
                role: 'link',
                onClick: () => go(page),
                onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(page); } },
                'aria-current': currentPage === page ? 'page' : undefined
            });

            return (
                <>
                    <nav className={scrolled ? 'scrolled' : ''}>
                        <img
                            src="logo.png"
                            alt="SOHA DESIGN"
                            className="logo"
                            onClick={() => go('home')}
                            onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }}
                        />
                        <div className="logo-text" onClick={() => go('home')} style={{ display: 'none' }}>
                            SOHA DESIGN
                        </div>

                        <button
                            ref={btnRef}
                            className="nav-toggle"
                            aria-expanded={open}
                            aria-controls="primary-nav"
                            aria-label={open ? '메뉴 닫기' : '메뉴 열기'}
                            onClick={() => setOpen(v => !v)}
                        >
                            <span></span><span></span><span></span>
                        </button>

                        <ul id="primary-nav" className={`nav-links ${open ? 'open' : ''}`} ref={listRef}>
                            <li><a {...linkProps('interior')}>Interior</a></li>
                            <li><a {...linkProps('rendering')}>Rendering</a></li>
                            <li><a {...linkProps('about')}>About</a></li>
                        </ul>
                    </nav>
                    {open && <div className="nav-backdrop" onClick={() => setOpen(false)}></div>}
                </>
            );
        }

        /* ---------- 홈 ---------- */
        function Home({ navigate }) {
            const items = sortProjects(projectsData);
            return (
                <>
                    <div className="hero">
                        <div className="hero-content">
                            <img src="hero-logo.png" alt="SOHA DESIGN" className="hero-logo"
                                 onError={(e) => { e.target.style.display = 'none'; }} />
                            <div className="hero-subtitle">Interior Design &amp; Build</div>

                    </div>
                    <div className="content-wrapper">

                        </div>

        /* ---------- 목록 (Interior / Rendering) ---------- */
        function ProjectList({ page, filter, setFilter, navigate }) {
            const isInterior = page === 'interior';
            const pool = sortProjects(projectsData.filter(p => p.type === (isInterior ? 'built' : '3d')));
            const items = filter === 'all' ? pool : pool.filter(p => p.category === filter);

            /* 0건 필터로 직접 진입하면 All 로 폴백하고 URL 도 정규화한다 */
            useEffect(() => {
                if (filter !== 'all' && pool.filter(p => p.category === filter).length === 0) {
                    setFilter('all');
                    window.history.replaceState(window.history.state, '', '#/' + page);
                }
            }, [filter, page]);

            const onFilter = (key) => {
                setFilter(key);
                window.history.replaceState(window.history.state, '',
                    key !== 'all' ? `#/${page}/${key}` : `#/${page}`);
            };

            return (
                <div className="content-wrapper projects-page-wrapper">
                    <div className="projects-section">
                        <h1 className="section-title">{isInterior ? 'Interior' : 'Rendering'}</h1>
                        <span className="section-subtitle">
                            {isInterior ? 'Completed Projects' : '3D Visualization'}
                        </span>
                        <FilterBar pool={pool} filter={filter} onChange={onFilter} />
                        <Grid items={items} onOpen={(id) => navigate('projectDetail', id)} />
                    </div>
                </div>
            );
        }

        /* ---------- 라이트박스 ---------- */
        function Lightbox({ images, currentIndex, onClose, onPrev, onNext }) {
            const cur = images[currentIndex];

            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowLeft') onPrev();
                    if (e.key === 'ArrowRight') onNext();
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose, onPrev, onNext]);

            /* 지점별로 카운터를 리셋한다 */
            let label;
            if (cur.si === undefined) {
                label = images.length > 1 ? `${currentIndex + 1} / ${images.length}` : null;
            } else {
                const start = images.findIndex(x => x.si === cur.si);
                const total = images.filter(x => x.si === cur.si).length;
                label = `${cur.store} · ${currentIndex - start + 1} / ${total}`;
            }

            return (
                <div className="lightbox-overlay" onClick={onClose}>
                    <div className="lightbox-content" onClick={(e) => e.stopPropagation()}>
                        <button className="lightbox-close" onClick={onClose} aria-label="닫기">✕</button>
                        <div className="lightbox-image-wrapper">
                            {images.length > 1 && <button className="lightbox-nav lightbox-prev" onClick={onPrev} aria-label="이전">‹</button>}
                            <img src={cur.src} alt="" />
                            {images.length > 1 && <button className="lightbox-nav lightbox-next" onClick={onNext} aria-label="다음">›</button>}
                        </div>
                        {cur.caption && <div className="lightbox-caption">{cur.caption}</div>}
                        {label && <div className="lightbox-counter">{label}</div>}
                    </div>
                </div>
            );
        }

        let _closingLightboxByButton = false;

        /* ---------- 상세 ---------- */
        function ProjectDetail({ selectedProject, navigate }) {
            const project = projectsData.find(p => p.id === selectedProject);
            const [lightboxOpen, setLightboxOpen] = useState(false);
            const [lightboxIndex, setLightboxIndex] = useState(0);
            const openRef = useRef(false);

            useEffect(() => { openRef.current = lightboxOpen; }, [lightboxOpen]);
            useEffect(() => () => { document.body.style.overflow = ''; }, []);

            useEffect(() => {
                const handlePop = () => {
                    if (_closingLightboxByButton) return;
                    if (openRef.current) { setLightboxOpen(false); document.body.style.overflow = ''; }
                };
                window.addEventListener('popstate', handlePop);
                return () => window.removeEventListener('popstate', handlePop);
            }, []);

            if (!project) return <div className="project-detail-page">Project not found</div>;

            const imgs = flatImages(project);
            const period = project.firstAt && project.firstAt !== project.completedAt
                ? fmtDate(project.firstAt) + ' — ' + fmtDate(project.completedAt)
                : fmtDate(project.completedAt);
            const meta = project.industry + ' · ' + period;

            const openLightbox = (i) => {
                setLightboxIndex(i);
                setLightboxOpen(true);
                document.body.style.overflow = 'hidden';
                window.history.pushState({ ...(window.history.state || {}), lightbox: true }, '');
            };
            const closeLightbox = () => {
                setLightboxOpen(false);
                document.body.style.overflow = '';
                if (window.history.state && window.history.state.lightbox) {
                    _closingLightboxByButton = true;
                    window.history.back();
                    setTimeout(() => { _closingLightboxByButton = false; }, 100);
                }
            };
            const prevImage = () => setLightboxIndex(i => (i === 0 ? imgs.length - 1 : i - 1));
            const nextImage = () => setLightboxIndex(i => (i === imgs.length - 1 ? 0 : i + 1));

            /* 직접 진입해 돌아갈 목록이 없으면 type 으로 목록을 새로 연다 */
            const backToList = () => {
                const st = window.history.state && window.history.state.list;
                if (st) window.history.back();
                else navigate(project.type === '3d' ? 'rendering' : 'interior', null, 'all');
            };

            let body;
            if (project.stores) {
                let offset = 0;
                body = (
                    <div className="stores-wrapper">
                        {project.stores.map((st, si) => {
                            const base = offset; offset += st.images.length;
                            return (
                                <div className="store-section" key={si}>
                                    <div className="store-head">
                                        <div className="store-name">{st.name}</div>
                                        <div className="store-year">{fmtDate(st.completedAt)}</div>
                                    </div>
                                    <div className="store-grid">
                                        {st.images.map((src, k) => (
                                            <div className="store-photo" key={k} onClick={() => openLightbox(base + k)}>
                                                <img src={src} alt={`${project.title} ${st.name} ${k + 1}`} loading="lazy" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            } else {
                body = (
                    <div className="detail-images-grid">
                        {imgs.map((im, i) => (
                            <div key={i} className="detail-image" onClick={() => openLightbox(i)} style={{ cursor: 'pointer' }}>
                                <div className="detail-photo">
                                    <img src={im.src} alt={`${project.title} - ${i + 1}`} loading="lazy" />
                                </div>
                                {im.caption && <p className="image-caption">{im.caption}</p>}
                            </div>
                        ))}
                    </div>
                );
            }

            return (
                <div className="project-detail-page">
                    <div className="back-btn" onClick={backToList}>← Back</div>
                    <div className="project-header">
                        <div className="project-title-row">
                            <h1>{project.title}</h1>
                            <CardBadges project={project} />
                        </div>
                        <div className="project-meta">{meta}</div>
                    </div>
                    {body}
                    {lightboxOpen && (
                        <Lightbox images={imgs} currentIndex={lightboxIndex}
                                  onClose={closeLightbox} onPrev={prevImage} onNext={nextImage} />
                    )}
                </div>
            );
        }

        /* ---------- Footer ---------- */
        function Footer() {
            return (
                <div className="footer">
                    <div className="footer-content">
                        <h2>Let's Work Together</h2>
                        <div className="footer-grid">
                            {/* ============================================================
                                🔧 [수정 포인트 13] 연락처 - 이메일
                                ============================================================ */}
                            <div className="footer-item">
                                <div className="footer-label">Email</div>
                                <div className="footer-value">dahee2769@naver.com</div>
                            </div>
                            
                            {/* ============================================================
                                🔧 [수정 포인트 14] 연락처 - 전화번호
                                ============================================================ */}
                            <div className="footer-item">
                                <div className="footer-label">Phone</div>
                                <div className="footer-value">+82 10-2271-2769</div>
                            </div>
                            
                            {/* ============================================================
                                🔧 [수정 포인트 15] 연락처 - 위치
                                ============================================================ */}
                            <div className="footer-item">
                                <div className="footer-label">Location</div>
                                <div className="footer-value">Seoul, Korea</div>
                            </div>
                        </div>
                        <div className="footer-bottom">
                            {/* ============================================================
                                🔧 [수정 포인트 16] 저작권 표시
                                ============================================================ */}
                            <div className="footer-copyright">© 2026 SOHA DESIGN. All rights reserved.</div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ---------- About ---------- */
        function About() {
            return (
                <div className="about-page">
                    <div className="about-hero">
                        <h1>About</h1>
                        <p className="about-intro">
                            SOHA DESIGN works across interior planning, visualization, and construction,
                            with a focus on commercial spaces.
                        </p>
                    </div>
                    <div className="about-content">
                        <div className="about-section">
                            <h2>Who We Are</h2>
                            <p>
                                Our experience in commercial interiors goes back to 2016 — restaurants, cafes,
                                bars, photo studios, and offices, with occasional residential projects.
                            </p>
                            <p>
                                Design planning, documentation, and 3D visualization are handled in-house.
                                We run the site through construction, and we remain available after handover
                                to support repairs and adjustments that may arise in day-to-day use.
                            </p>
                            <p>
                                One location often leads to another for the same brand, usually through referrals.
                            </p>
                        </div>
                        <div className="about-section">
                            <h2>What We Do</h2>
                            <div className="services-grid">
                                <div className="service-item">Design Planning</div>
                                <div className="service-item">Space Layout &amp; Documentation</div>
                                <div className="service-item">3D Rendering &amp; Visualization</div>
                                <div className="service-item">Material &amp; Finish Consulting</div>
                                <div className="service-item">Construction &amp; Site Management</div>
                                <div className="service-item">Post-Completion Support</div>
                                <div className="service-item">Multi-Store Projects</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ---------- 라우팅 ---------- */
        function parseHash() {
            const parts = (window.location.hash.slice(1) || '/').split('/').filter(Boolean);
            if (parts[0] === 'about')     return { page: 'about', project: null, filter: 'all' };
            if (parts[0] === 'interior')  return { page: 'interior', project: null, filter: parts[1] || 'all' };
            if (parts[0] === 'rendering') return { page: 'rendering', project: null, filter: parts[1] || 'all' };
            if (parts[0] === 'project' && parts[1]) {
                const id = parseInt(parts[1], 10);
                if (projectsData.some(p => p.id === id)) return { page: 'projectDetail', project: id, filter: 'all' };
            }
            return { page: 'home', project: null, filter: 'all' };
        }

        function stateToHash(page, project, filter) {
            if (page === 'about') return '#/about';
            if (page === 'interior')  return filter && filter !== 'all' ? `#/interior/${filter}`  : '#/interior';
            if (page === 'rendering') return filter && filter !== 'all' ? `#/rendering/${filter}` : '#/rendering';
            if (page === 'projectDetail' && project) return `#/project/${project}`;
            return '#/';
        }

        /* ---------- App ---------- */
        function App() {
            const initial = parseHash();
            const [currentPage, setCurrentPage] = useState(initial.page);
            const [selectedProject, setSelectedProject] = useState(initial.project);
            const [filter, setFilter] = useState(initial.filter);

            const pageRef = useRef(currentPage);
            const filterRef = useRef(filter);
            useEffect(() => { pageRef.current = currentPage; }, [currentPage]);
            useEffect(() => { filterRef.current = filter; }, [filter]);

            useEffect(() => {
                const handlePopState = () => {
                    if (_closingLightboxByButton) return;
                    document.body.style.overflow = '';

                    const s = parseHash();
                    const isPageChange = s.page !== pageRef.current;
                    setCurrentPage(s.page);
                    setSelectedProject(s.project);

                    /* 목록으로 돌아온 경우 저장해 둔 필터·스크롤을 복원한다 */
                    const saved = window.history.state && window.history.state.list;
                    if (saved && LIST_PAGES.indexOf(s.page) !== -1) {
                        setFilter(saved.filter || s.filter);
                        /* 목록이 다시 그려진 뒤에 복원해야 위치가 맞는다 — 몇 차례 재시도한다 */
                        const y = saved.scrollY || 0;
                        [0, 120, 320, 600].forEach(d => setTimeout(() => {
                            requestAnimationFrame(() => window.scrollTo(0, y));
                        }, d));
                    } else {
                        setFilter(s.filter);
                        if (isPageChange) setTimeout(() => window.scrollTo(0, 0), 0);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                window.addEventListener('hashchange', handlePopState);
                return () => {
                    window.removeEventListener('popstate', handlePopState);
                    window.removeEventListener('hashchange', handlePopState);
                };
            }, []);

            const navigate = (page, project = selectedProject, newFilter = filter) => {
                const leavingList = LIST_PAGES.indexOf(pageRef.current) !== -1;

                /* 목록 → 상세로 갈 때, 떠나기 직전 목록 상태를 현재 엔트리에 기록하고 상세에도 들려 보낸다 */
                let carry = null;
                if (page === 'projectDetail' && leavingList) {
                    const snap = { page: pageRef.current, filter: filterRef.current, scrollY: window.scrollY };
                    window.history.replaceState({ list: snap }, '');
                    carry = { list: snap };
                }

                setCurrentPage(page);
                if (project !== selectedProject) setSelectedProject(project);
                if (newFilter !== filter) setFilter(newFilter);

                window.history.pushState(carry, '', stateToHash(page, project, newFilter));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            let content;
            if (currentPage === 'home') {
                content = <Home navigate={navigate} />;
            } else if (currentPage === 'interior' || currentPage === 'rendering') {
                content = <ProjectList page={currentPage} filter={filter} setFilter={setFilter} navigate={navigate} />;
            } else if (currentPage === 'projectDetail') {
                content = <ProjectDetail selectedProject={selectedProject} navigate={navigate} />;
            } else if (currentPage === 'about') {
                content = <About />;
            }

            return (
                <>
                    <Navigation currentPage={currentPage} navigate={navigate} />
                    <main>{content}</main>
                    <Footer />
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

</body>
